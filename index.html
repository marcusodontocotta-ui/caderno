<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caderno de Estudos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>
  <style>
    .canvas-hidden { display: none !important; }
    #canvasLayer { touch-action: none; }
    #pdfLayer, #mediaLayer { pointer-events: none; }
    #drawingCanvas { cursor: crosshair; }
    #editor:empty::before {
      content: attr(data-placeholder);
      color: #9ca3af;
      pointer-events: none;
    }
    .hebrew-text { direction: rtl; font-family: "SBL Hebrew", "Frank Ruhl Hofshi", "Ezra SIL", "David", "Times New Roman", serif; font-size: 1.4rem; line-height: 2; }
    mark { background: #ffe45c; color: inherit; padding: 0 1px; border-radius: 2px; }
    #bibleContent mark { background: #ffe45c; }
    u { text-decoration-thickness: 1.5px; }
    #drawer { transition: transform 0.25s ease; }
    #drawer.open { transform: translateX(0); }
    #drawerBackdrop { transition: opacity 0.2s ease; }
    #editor img { display: inline-block; max-width: 100%; height: auto; border-radius: 6px; margin: 4px; vertical-align: middle; cursor: pointer; }
    #editor img.selected { outline: 3px solid #3b82f6; outline-offset: 2px; }
    #editor table { border-collapse: collapse; margin: 6px 0; }
    #editor table td, #editor table th { border: 1px solid #d1d5db; padding: 4px 8px; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
  <!-- Topbar -->
  <header class="bg-white shadow px-4 py-3 flex items-center justify-between border-b border-gray-200 shrink-0 flex-wrap gap-2">
    <div class="flex items-center gap-3">
      <h1 class="text-lg font-bold text-gray-800">📓 Caderno de Estudos</h1>
      <input
        id="notebookName"
        type="text"
        placeholder="Nome do caderno..."
        class="text-sm text-gray-600 bg-gray-50 border border-gray-300 rounded px-2 py-1 w-48 focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
    </div>
    <div class="flex items-center gap-2 flex-wrap justify-end">
      <button id="btnNotebooks" title="Abrir meus cadernos" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-3 py-1.5 rounded transition">
        📚 Cadernos
      </button>
      <button id="btnLayout" title="Alternar 50/50 ou tela cheia" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3 py-1.5 rounded transition">
        ⛶ Tela cheia
      </button>
      <button id="btnNewNotebook" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-3 py-1.5 rounded transition">
        + Novo caderno
      </button>
      <button id="btnNewPage" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded transition">
        + Nova página
      </button>
      <button id="btnPrevPage" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded transition">
        ‹ Anterior
      </button>
      <span id="pageIndicator" class="text-xs text-gray-600 font-medium px-1">1 / 1</span>
      <button id="btnNextPage" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded transition">
        Próxima ›
      </button>
    </div>
  </header>

  <!-- Drawer lateral: lista de cadernos -->
  <div id="drawerBackdrop" class="fixed inset-0 bg-black/30 z-40 hidden"></div>
  <aside id="drawer" class="fixed top-0 left-0 h-full w-80 max-w-[85vw] bg-white shadow-2xl z-50 flex flex-col -translate-x-full">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 shrink-0">
      <h2 class="font-bold text-gray-800">📚 Meus Cadernos</h2>
      <button id="btnCloseDrawer" class="text-gray-400 hover:text-gray-700 text-xl leading-none px-1" title="Fechar">✕</button>
    </div>
    <div id="notebookList" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    <div class="p-3 border-t border-gray-200 shrink-0">
      <button id="btnNewNotebookDrawer" class="w-full text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-2 rounded transition">
        + Novo caderno
      </button>
    </div>
  </aside>

  <!-- Corpo: 50/50 ou tela cheia -->
  <main id="mainLayout" class="flex-1 flex flex-col md:flex-row overflow-hidden">

    <!-- Editor (esquerda) -->
    <section id="editorPane" class="flex-1 flex flex-col md:w-1/2 bg-white md:border-r border-gray-200 overflow-hidden">
      <div class="shrink-0 px-4 py-2 bg-gray-50 border-b border-gray-200 flex items-center gap-3 flex-wrap">
        <label class="text-xs font-semibold text-gray-500">Fonte:</label>
        <input id="fontSize" type="range" min="12" max="32" value="17" class="w-24" />
        <button id="btnBold" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100 font-bold">B</button>
        <button id="btnItalic" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100 italic">I</button>
        <button id="btnUnderline" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100 underline">U</button>
        <button id="btnHighlight" title="Realçar (grifar) texto selecionado" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-yellow-100">🖍 Realçar</button>
        <span class="w-px h-5 bg-gray-300 mx-1"></span>
        <button id="btnAlignLeft" title="Alinhar à esquerda" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">≡←</button>
        <button id="btnAlignCenter" title="Centralizar" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">≡</button>
        <button id="btnAlignRight" title="Alinhar à direita" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">≡→</button>
        <button id="btnAlignJustify" title="Justificar" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">≡⇔</button>
        <span class="w-px h-5 bg-gray-300 mx-1"></span>
        <label title="Inserir imagem no cursor" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100 cursor-pointer">🖼 Imagem
          <input id="imgInput" type="file" accept="image/*,.xlsx,.xls,.csv" class="hidden" />
        </label>
        <button id="btnImgSize" title="Redimensionar a imagem selecionada" class="hidden text-xs px-2 py-1 rounded border border-blue-400 bg-blue-50 text-blue-700 hover:bg-blue-100">↔ Tamanho</button>
        <button id="btnExportText" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100 ml-auto">⬇ Exportar texto</button>
      </div>
      <div class="shrink-0 px-3 py-1.5 bg-white border-b border-gray-200 flex items-center gap-1 overflow-x-auto">
        <span class="text-xs font-semibold text-gray-500 mr-1 shrink-0">Páginas:</span>
        <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto"></div>
      </div>
      <div
        id="editor"
        contenteditable="true"
        data-placeholder="Escreva suas anotações de aula aqui..."
        class="flex-1 w-full p-4 overflow-auto outline-none text-gray-800 leading-relaxed"
      ></div>
    </section>

    <!-- Painel direito: Anexos / Bíblia -->
    <section id="rightPane" class="flex-1 flex flex-col md:w-1/2 bg-gray-50 overflow-hidden">
      <!-- Abas -->
      <div class="shrink-0 px-3 pt-2 bg-gray-50 border-b border-gray-200 flex items-center gap-1">
        <button id="tabAnnex" class="text-xs font-medium px-3 py-1.5 rounded-t border border-b-0">📎 Anexos</button>
        <button id="tabBible" class="text-xs font-medium px-3 py-1.5 rounded-t border border-b-0">📖 Bíblia</button>
      </div>

      <!-- ============ ABA ANEXOS ============ -->
      <div id="annexTab" class="flex-1 flex flex-col overflow-hidden">
        <!-- Toolbar de anexo -->
        <div class="shrink-0 px-4 py-2 bg-gray-50 border-b border-gray-200 flex items-center gap-2 flex-wrap">
          <label class="cursor-pointer text-xs bg-white border border-gray-300 rounded px-3 py-1.5 hover:bg-gray-100 transition">
            📎 Anexar arquivo
            <input id="fileInput" type="file" accept=".pdf,image/*" class="hidden" />
          </label>
          <span class="text-xs text-gray-400">ou</span>
          <button id="btnSnap" class="text-xs bg-white border border-gray-300 rounded px-3 py-1.5 hover:bg-gray-100 transition">
            📷 Capturar câmera
          </button>

          <div class="w-px h-6 bg-gray-300 mx-2"></div>

          <label class="text-xs flex items-center gap-1 text-gray-600">
            <input id="chkDrawing" type="checkbox" class="accent-blue-600" /> ✏️ Desenhar
          </label>
          <input id="penColor" type="color" value="#ef4444" class="w-7 h-7 border border-gray-300 rounded cursor-pointer" title="Cor da caneta" />
          <input id="penSize" type="range" min="1" max="20" value="4" class="w-20" title="Espessura da caneta" />
          <select id="penTool" title="Ferramenta de desenho" class="text-xs bg-white border border-gray-300 rounded px-2 py-1.5">
            <option value="pen">🖊️ Caneta</option>
            <option value="marker">🖍️ Realçador</option>
            <option value="line">📏 Linha</option>
          </select>
          <button id="btnClearDrawing" class="text-xs px-2 py-1.5 rounded border border-gray-300 hover:bg-gray-100">🧽 Limpar desenho</button>
          <button id="btnDelAttachment" class="text-xs px-2 py-1.5 rounded border border-red-300 text-red-600 hover:bg-red-50">🗑 Remover anexo</button>
        </div>

        <!-- Area de midia + tela de desenho -->
        <div id="viewer" class="flex-1 relative overflow-auto bg-[repeating-conic-gradient(#e5e5e5_0%_25%,#ffffff_0%_50%)] bg-[size:16px_16px]">
          <canvas id="pdfLayer" class="absolute inset-0 m-auto max-w-full max-h-full canvas-hidden"></canvas>
          <img id="mediaLayer" class="absolute inset-0 m-auto max-w-full max-h-full canvas-hidden object-contain" alt="anexo" />
          <canvas id="drawingCanvas" class="absolute inset-0 m-auto max-w-full max-h-full"></canvas>

          <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-center p-6">
            <div class="text-5xl mb-3">🖼️</div>
            <p class="font-medium">Nenhum anexo nesta página</p>
            <p class="text-sm mt-1">Anexe um PDF ou foto e desenhe por cima</p>
          </div>
        </div>
      </div>

      <!-- ============ ABA BÍBLIA ============ -->
      <div id="bibleTab" class="flex-1 flex-col overflow-hidden hidden">
        <!-- Toolbar Bíblia -->
        <div class="shrink-0 px-4 py-2 bg-gray-50 border-b border-gray-200 flex items-center gap-2 flex-wrap">
          <select id="bibleVersion" class="text-xs bg-white border border-gray-300 rounded px-2 py-1.5">
            <option value="almeida-livre">Português — Almeida (Bíblia Livre)</option>
            <option value="kjv">Inglês — King James (KJV)</option>
            <option value="web">Inglês — World English (WEB)</option>
            <option value="asv">Inglês — American Standard (ASV)</option>
          </select>
          <label class="text-xs flex items-center gap-1 text-gray-600 ml-1">
            <input id="chkHebrew" type="checkbox" class="accent-blue-600" /> עברית Hebraico original
          </label>

          <div class="w-px h-6 bg-gray-300 mx-2"></div>

          <select id="bibleBook" class="text-xs bg-white border border-gray-300 rounded px-2 py-1.5 max-w-[10rem]"></select>
          <select id="bibleChapter" class="text-xs bg-white border border-gray-300 rounded px-2 py-1.5"></select>
          <label class="text-xs flex items-center gap-1 text-gray-600 ml-1">
            <input id="bibleFontRange" type="range" min="12" max="40" value="17" class="w-20" /> A-
          </label>
          <button id="bibleMark" title="Realçar o texto selecionado" class="text-xs px-2 py-1.5 rounded border border-gray-300 hover:bg-yellow-100">🖍 Realçar</button>
          <button id="bibleUnder" title="Sublinhar o texto selecionado" class="text-xs px-2 py-1.5 rounded border border-gray-300 hover:bg-gray-100">U Sublinhar</button>
          <button id="bibleUnmark" title="Remover realces/sublinhados desta página" class="text-xs px-2 py-1.5 rounded border border-gray-300 hover:bg-red-50">🧹 Limpar marcas</button>
          <button id="bibleCopy" class="text-xs px-2 py-1.5 ml-auto rounded border border-gray-300 hover:bg-gray-100">📋 Copiar</button>
        </div>

        <!-- Conteúdo -->
        <div id="bibleContent" class="flex-1 overflow-auto p-4 bg-white text-gray-800 leading-relaxed"></div>
      </div>
    </section>
  </main>

  <script>
    "use strict";
    /* =========================================================
       Estado e persistência (localStorage)
       ========================================================= */
    const STORAGE_KEY = "cadernoEstudos.v2";

    let state = {
      notebooks: [
        {
          id: "default",
          name: "Meu Caderno",
          pages: [
            { text: "", attachment: null, drawing: null },
          ],
        },
      ],
      activeNotebookId: "default",
      activePageIndex: 0,
      layout: "split",        // 'split' | 'fullRight' | 'fullEditor'
      bible: {
        version: "almeida-livre",
        hebrew: false,
        book: "Gen",
        chapter: 1,
        saved: {},      // render salvo por capítulo (preserva realces/sublinhados)
        fontScale: 16,
      },
      activeTab: "annex",     // 'annex' | 'bible'
    };

    function defaultPage() {
      return { text: "", attachment: null, drawing: null };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state = JSON.parse(raw);
        state.layout = state.layout || "split";
        state.activeTab = state.activeTab || "annex";
        state.bible = Object.assign({ version: "almeida-livre", hebrew: false, book: "Gen", chapter: 1, saved: {}, fontScale: 16 }, state.bible);
        if (!state.bible.saved) state.bible.saved = {};
        if (!state.bible.fontScale) state.bible.fontScale = 16;
        state.notebooks.forEach((n) => n.pages.forEach((p) => { if (p.text === undefined) p.text = ""; }));
      } catch (e) {
        console.warn("Falha ao carregar estado", e);
      }
    }
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        if (e && (e.name === "QuotaExceededError" || e.code === 22)) {
          alert("Aviso: os anexos ficaram grandes demais para o armazenamento local (limite ~5MB). Considere exportar ou reduzir o tamanho das imagens.");
        }
      }
    }

    function notebook() {
      return state.notebooks.find((n) => n.id === state.activeNotebookId) ||
             state.notebooks[0];
    }
    function page() {
      const n = notebook();
      if (state.activePageIndex >= n.pages.length) state.activePageIndex = n.pages.length - 1;
      if (state.activePageIndex < 0) state.activePageIndex = 0;
      return n.pages[state.activePageIndex];
    }

    /* =========================================================
       Referências DOM
       ========================================================= */
    const $ = (id) => document.getElementById(id);
    const editor = $("editor");
    const notebookName = $("notebookName");
    const pageIndicator = $("pageIndicator");
    const mainLayout = $("mainLayout");
    const editorPane = $("editorPane");
    const rightPane = $("rightPane");
    const viewer = $("viewer");
    const pdfLayer = $("pdfLayer");
    const mediaLayer = $("mediaLayer");
    const drawingCanvas = $("drawingCanvas");
    const emptyState = $("emptyState");
    const fileInput = $("fileInput");
    const chkDrawing = $("chkDrawing");
    const penColor = $("penColor");
    const penSize = $("penSize");
    const penTool = $("penTool");

    const annexTab = $("annexTab");
    const bibleTab = $("bibleTab");
    const tabAnnex = $("tabAnnex");
    const tabBible = $("tabBible");
    const btnLayout = $("btnLayout");
    const drawer = $("drawer");
    const drawerBackdrop = $("drawerBackdrop");
    const notebookList = $("notebookList");
    const pageTabs = $("pageTabs");
    const btnImgSize = $("btnImgSize");

    const ctx = drawingCanvas.getContext("2d");

    /* =========================================================
       Layout: 50/50 vs tela cheia
       ========================================================= */
    function applyLayout() {
      if (state.layout === "fullRight") {
        // Anexos/Bíblia em tela cheia
        editorPane.classList.add("hidden");
        editorPane.classList.remove("md:w-1/2");
        rightPane.classList.remove("md:w-1/2");
        rightPane.classList.add("w-full");
        mainLayout.classList.remove("md:flex-row");
        mainLayout.classList.add("flex-col");
        btnLayout.textContent = "✏️ Editor cheio";
      } else if (state.layout === "fullEditor") {
        // Caderno (editor) em tela cheia
        editorPane.classList.remove("hidden");
        editorPane.classList.remove("md:w-1/2");
        editorPane.classList.add("w-full");
        rightPane.classList.add("hidden");
        rightPane.classList.remove("md:w-1/2");
        rightPane.classList.remove("w-full");
        mainLayout.classList.remove("md:flex-row");
        mainLayout.classList.add("flex-col");
        btnLayout.textContent = "⊞ 50/50";
      } else {
        // 50/50
        editorPane.classList.remove("hidden");
        editorPane.classList.add("md:w-1/2");
        editorPane.classList.remove("w-full");
        rightPane.classList.remove("hidden");
        rightPane.classList.add("md:w-1/2");
        rightPane.classList.remove("w-full");
        mainLayout.classList.add("md:flex-row");
        mainLayout.classList.remove("flex-col");
        btnLayout.textContent = "⛶ Tela cheia";
      }
      setTimeout(onViewerResize, 50);
    }

    btnLayout.addEventListener("click", () => {
      // split -> fullRight -> fullEditor -> split
      state.layout = state.layout === "split" ? "fullRight" : (state.layout === "fullRight" ? "fullEditor" : "split");
      saveState();
      applyLayout();
      if (state.layout !== "split") {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });

    /* =========================================================
       Abas: Anexos / Bíblia
       ========================================================= */
    function applyTab() {
      const isAnnex = state.activeTab === "annex";
      annexTab.classList.toggle("hidden", !isAnnex);
      annexTab.classList.toggle("flex", isAnnex);
      bibleTab.classList.toggle("hidden", isAnnex);
      bibleTab.classList.toggle("flex", !isAnnex);

      tabAnnex.classList.toggle("bg-white", isAnnex);
      tabAnnex.classList.toggle("border-gray-300", isAnnex);
      tabAnnex.classList.toggle("text-blue-700", isAnnex);
      tabAnnex.classList.toggle("bg-transparent", !isAnnex);
      tabAnnex.classList.toggle("border-transparent", !isAnnex);
      tabAnnex.classList.toggle("text-gray-500", !isAnnex);

      tabBible.classList.toggle("bg-white", !isAnnex);
      tabBible.classList.toggle("border-gray-300", !isAnnex);
      tabBible.classList.toggle("text-blue-700", !isAnnex);
      tabBible.classList.toggle("bg-transparent", isAnnex);
      tabBible.classList.toggle("border-transparent", isAnnex);
      tabBible.classList.toggle("text-gray-500", isAnnex);

      if (!isAnnex) loadBible();
    }

    tabAnnex.addEventListener("click", () => { state.activeTab = "annex"; saveState(); applyTab(); });
    tabBible.addEventListener("click", () => { state.activeTab = "bible"; saveState(); applyTab(); });

    /* =========================================================
       Render da página ativa (anexos)
       ========================================================= */
    function renderUI() {
      const n = notebook();
      notebookName.value = n.name;
      pageIndicator.textContent = (state.activePageIndex + 1) + " / " + n.pages.length;
      renderPageTabs();
      editor.innerHTML = page().text || "";

      const att = page().attachment;
      pdfLayer.classList.add("canvas-hidden");
      mediaLayer.classList.add("canvas-hidden");
      emptyState.style.display = "flex";
      drawingCanvas.classList.add("canvas-hidden");

      if (att && att.type === "pdf") {
        renderPdf(att);
      } else if (att && att.type === "image") {
        emptyState.style.display = "none";
        mediaLayer.src = att.dataUrl;
        mediaLayer.classList.remove("canvas-hidden");
        showPdfOverlay("image");
      } else {
        positionCanvas(0, 0);
        emptyState.style.display = "flex";
      }
    }

    function showPdfOverlay(mode) {
      if (mode === "image") {
        fitCanvasToMedia(mediaLayer);
      }
      drawingCanvas.classList.remove("canvas-hidden");
      if (page().drawing) {
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
          ctx.drawImage(img, 0, 0, drawingCanvas.width, drawingCanvas.height);
        };
        img.src = page().drawing;
      }
    }

    function positionCanvas(w, h) {
      const r = viewer.getBoundingClientRect();
      const maxW = Math.max(r.width * 0.9, 100);
      const maxH = Math.max(r.height * 0.9, 100);
      let cw = w, ch = h;
      if (w > maxW || h > maxH) {
        const scale = Math.min(maxW / w, maxH / h);
        cw = w * scale;
        ch = h * scale;
      }
      drawingCanvas.width = cw;
      drawingCanvas.height = ch;
      drawingCanvas.style.left = "0";
      drawingCanvas.style.top = "0";
    }

    function fitCanvasToMedia(el) {
      const onLoad = () => {
        positionCanvas(el.naturalWidth, el.naturalHeight);
        viewer.dispatchEvent(new Event("resize"));
      };
      if (el.complete && el.naturalWidth > 0) {
        onLoad();
      } else {
        el.onload = onLoad;
      }
    }

    /* ---- Render PDF via pdf.js ---- */
    let currentPdfDoc = null;
    async function renderPdf(att) {
      try {
        const pdfDoc = await pdfjsLib.getDocument({ data: base64ToUint8Array(att.dataUrl) }).promise;
        currentPdfDoc = pdfDoc;
        att.pageCount = pdfDoc.numPages;
        if (att.currentPdfPage === undefined) att.currentPdfPage = 1;
        await drawPdfPage(pdfDoc, att.currentPdfPage);
      } catch (e) {
        console.error("Erro ao renderizar PDF", e);
        alert("Não foi possível renderizar este PDF. Talvez o arquivo esteja corrompido.");
      }
    }

    function base64ToUint8Array(dataUrl) {
      const base64 = dataUrl.split(",")[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function drawPdfPage(pdfDoc, pageNo) {
      const vp = await pdfDoc.getPage(pageNo).then((p) => p.getViewport({ scale: 1 }));
      const r = viewer.getBoundingClientRect();
      const maxW = Math.max(r.width * 0.9, 100);
      const maxH = Math.max(r.height * 0.9, 100);
      const scale = Math.min(maxW / vp.width, maxH / vp.height, 2);

      const viewport = await pdfDoc.getPage(pageNo).then((p) => p.getViewport({ scale }));
      const pageObj = await pdfDoc.getPage(pageNo);

      pdfLayer.width = viewport.width;
      pdfLayer.height = viewport.height;
      const pctx = pdfLayer.getContext("2d");
      await pageObj.render({ canvasContext: pctx, viewport }).promise;

      pdfLayer.classList.remove("canvas-hidden");
      pdfLayer.style.width = viewport.width + "px";
      pdfLayer.style.height = viewport.height + "px";
      emptyState.style.display = "none";

      positionCanvas(viewport.width, viewport.height);
      drawingCanvas.classList.remove("canvas-hidden");
      if (page().drawing) {
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
          ctx.drawImage(img, 0, 0, drawingCanvas.width, drawingCanvas.height);
        };
        img.src = page().drawing;
      }
      saveState();
    }

    document.addEventListener("keydown", (e) => {
      if (page().attachment && page().attachment.type === "pdf" && currentPdfDoc) {
        if (e.key === "ArrowRight" && page().attachment.currentPdfPage < currentPdfDoc.numPages) {
          page().attachment.currentPdfPage++;
          drawPdfPage(currentPdfDoc, page().attachment.currentPdfPage);
        } else if (e.key === "ArrowLeft" && page().attachment.currentPdfPage > 1) {
          page().attachment.currentPdfPage--;
          drawPdfPage(currentPdfDoc, page().attachment.currentPdfPage);
        }
      }
    });

    /* =========================================================
       Desenho (sobreposição)
       ========================================================= */
    let drawing = false;
    let lastPt = null;
    let lineStart = null;

    drawingCanvas.addEventListener("mousedown", (e) => startDrawFrom(e.clientX, e.clientY));
    drawingCanvas.addEventListener("mousemove", (e) => moveDrawFrom(e.clientX, e.clientY));
    window.addEventListener("mouseup", stopDraw);
    drawingCanvas.addEventListener("touchstart", (e) => { e.preventDefault(); const t = e.touches[0]; startDrawFrom(t.clientX, t.clientY); });
    drawingCanvas.addEventListener("touchmove", (e) => { e.preventDefault(); const t = e.touches[0]; moveDrawFrom(t.clientX, t.clientY); });
    window.addEventListener("touchend", stopDraw);

    function startDrawFrom(x, y) {
      if (!chkDrawing.checked) return;
      if (!page().attachment && page().drawing === null) return;
      const rect = drawingCanvas.getBoundingClientRect();
      const sx = drawingCanvas.width / rect.width;
      const sy = drawingCanvas.height / rect.height;
      const px = (x - rect.left) * sx;
      const py = (y - rect.top) * sy;
      drawing = true;
      lastPt = { x: px, y: py };
      lineStart = { x: px, y: py };
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = penColor.value;
      ctx.globalAlpha = penTool.value === "marker" ? 0.35 : 1;
      ctx.lineWidth = (penTool.value === "marker" ? 3 : 1) * parseInt(penSize.value, 10) * Math.max(sx, sy);
    }
    function moveDrawFrom(x, y) {
      if (!drawing) return;
      const rect = drawingCanvas.getBoundingClientRect();
      const sx = drawingCanvas.width / rect.width;
      const sy = drawingCanvas.height / rect.height;
      const px = (x - rect.left) * sx;
      const py = (y - rect.top) * sy;
      if (penTool.value === "line") {
        lastPt = { x: px, y: py };
        return;
      }
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(px, py);
      ctx.stroke();
      lastPt = { x: px, y: py };
    }
    function stopDraw() {
      if (!drawing) return;
      drawing = false;
      if (penTool.value === "line") {
        ctx.globalAlpha = 1;
        ctx.lineWidth = parseInt(penSize.value, 10) * Math.max(
          drawingCanvas.width / drawingCanvas.getBoundingClientRect().width,
          drawingCanvas.height / drawingCanvas.getBoundingClientRect().height
        );
        ctx.beginPath();
        ctx.moveTo(lineStart.x, lineStart.y);
        ctx.lineTo(lastPt.x, lastPt.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      page().drawing = drawingCanvas.toDataURL();
      saveState();
    }

    $("btnSnap").addEventListener("click", async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Este navegador não suporta acesso à câmera. Use HTTPS/localhost ou anexe um arquivo.");
          return;
        }
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        const video = document.createElement("video");
        video.srcObject = stream;
        video.play();
        await new Promise((r) => (video.onloadedmetadata = r));
        const c = document.createElement("canvas");
        c.width = video.videoWidth;
        c.height = video.videoHeight;
        c.getContext("2d").drawImage(video, 0, 0);
        stream.getTracks().forEach((t) => t.stop());
        page().attachment = {
          type: "image",
          dataUrl: c.toDataURL("image/jpeg", 0.85),
          name: "foto-camera.jpg",
          pageCount: 1,
        };
        saveState();
        renderUI();
      } catch (e) {
        alert("Não foi possível acessar a câmera: " + e.message);

    // Inserir imagem ou planilha no cursor do editor
    $("imgInput").addEventListener("change", (e) => {
      const f = e.target.files[0];
      e.target.value = "";
      if (!f) return;
      const isImage = f.type && f.type.indexOf("image") === 0;
      if (isImage) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          editor.focus();
          document.execCommand("insertHTML", false, '<img src="' + ev.target.result + '" alt="imagem" />');
          page().text = editor.innerHTML;
          saveState();
        };
        reader.readAsDataURL(f);
      } else {
        // planilha: inserir como tabela simples (melhor assim do que tentar renderizar o binário)
        const reader = new FileReader();
        reader.onload = (ev) => {
          const text = String(ev.target.result || "").trim();
          const rows = text.split(/\r?\n/).map((r) => r.split("\t"));
          let html = "<table>";
          rows.forEach(function (row, i) {
            html += "<tr>";
            row.forEach(function (cell) {
              const cellText = cell.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
              html += (i === 0 ? "<th>" : "<td>") + cellText + (i === 0 ? "</th>" : "</td>");
            });
            html += "</tr>";
          });
          html += "</table>";
          editor.focus();
          document.execCommand("insertHTML", false, html);
          page().text = editor.innerHTML;
          saveState();
        };
        reader.readAsText(f);
      }
    });

    // Selecionar imagem clicada dentro do editor
    let selectedImg = null;
    editor.addEventListener("click", (e) => {
      const img = e.target.closest ? e.target.closest("img") : null;
      if (selectedImg) selectedImg.classList.remove("selected");
      selectedImg = img;
      if (selectedImg) {
        selectedImg.classList.add("selected");
        btnImgSize.classList.remove("hidden");
        editor.focus();
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(selectedImg);
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        btnImgSize.classList.add("hidden");
      }
    });

    // Redimensionar a imagem selecionada
    btnImgSize.addEventListener("click", () => {
      if (!selectedImg) { alert("Clique em uma imagem para selecioná-la e depois redimensione."); return; }
      const current = selectedImg.style.width || (selectedImg.getBoundingClientRect().width) + "px";
      const val = prompt("Largura da imagem (px) — ex.: 150, 300, 600:", current.replace("px", ""));
      if (val === null) return;
      const w = parseInt(val, 10);
      if (isNaN(w) || w <= 0) return;
      selectedImg.style.width = w + "px";
      selectedImg.style.height = "auto";
      page().text = editor.innerHTML;
      saveState();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Delete" || e.key === "Backspace") {
        if (selectedImg && window.getSelection().isCollapsed && editor.contains(selectedImg)) {
          e.preventDefault();
          selectedImg.remove();
          selectedImg = null;
          btnImgSize.classList.add("hidden");
          page().text = editor.innerHTML;
          saveState();
        }
      }
      if (e.key === "Escape") {
        if (selectedImg) { selectedImg.classList.remove("selected"); selectedImg = null; btnImgSize.classList.add("hidden"); }
      }
    });

    // Colar imagem/tabela de planilha dentro do editor
    editor.addEventListener("paste", (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf("image") === 0) {
          e.preventDefault();
          const blob = items[i].getAsFile();
          if (!blob) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            editor.focus();
            document.execCommand("insertHTML", false, '<img src="' + ev.target.result + '" alt="colada" />');
            page().text = editor.innerHTML;
            saveState();
          };
          reader.readAsDataURL(blob);
          return;
        }
      }
      editor.addEventListener("blur", () => { page().text = editor.innerHTML; saveState(); }, { once: true });
    });

    function renderNotebookList() {
      notebookList.innerHTML = "";
      state.notebooks.forEach((nb) => {
        const item = document.createElement("div");
        const active = nb.id === state.activeNotebookId;
        item.className = "border rounded-lg overflow-hidden " + (active ? "border-blue-400 ring-1 ring-blue-200" : "border-gray-200");
        const head = document.createElement("div");
        head.className = "flex items-center gap-2 px-3 py-2 bg-gray-50 cursor-pointer hover:bg-gray-100";
        head.innerHTML = '<span class="font-semibold text-gray-800 flex-1 truncate">' + escapeHtml(nb.name || "Sem nome") + "</span>" +
          '<span class="text-xs text-gray-400 shrink-0">' + nb.pages.length + " pg</span>";
        const actions = document.createElement("div");
        actions.className = "flex items-center justify-end gap-1 px-2 pb-2";
        actions.innerHTML =
          '<button data-act="open" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-blue-50 text-blue-700">Abrir</button>' +
          '<button data-act="rename" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">Renomear</button>' +
          '<button data-act="del" class="text-xs px-2 py-1 rounded border border-red-300 text-red-600 hover:bg-red-50">Excluir</button>';
        head.addEventListener("click", () => selectNotebook(nb.id));
        actions.addEventListener("click", (e) => {
          const act = e.target.closest("button").getAttribute("data-act");
          if (act === "open") selectNotebook(nb.id);
          else if (act === "rename") {
            const name = prompt("Novo nome do caderno:", nb.name);
            if (name !== null && name.trim() !== "") { nb.name = name.trim(); saveState(); renderNotebookList(); renderUI(); }
          } else if (act === "del") {
            if (state.notebooks.length <= 1) { alert("Não é possível excluir o único caderno."); return; }
            if (!confirm("Excluir o caderno \"" + nb.name + "\"? Esta ação não pode ser desfeita.")) return;
            state.notebooks = state.notebooks.filter((x) => x.id !== nb.id);
            if (state.activeNotebookId === nb.id) {
              state.activeNotebookId = state.notebooks[0].id;
              state.activePageIndex = 0;
              currentPdfDoc = null;
            }
            saveState();
            renderNotebookList();
            renderUI();
          }
        });
        item.appendChild(head);
        item.appendChild(actions);
        notebookList.appendChild(item);
      });

      { osis: "Heb",  names: ["Hebreus", "Hebrews", null], ch: 13 },
      { osis: "Jas",  names: ["Tiago", "James", null], ch: 5 },
      { osis: "1Pet", names: ["1 Pedro", "1 Peter", null], ch: 5 },
      { osis: "2Pet", names: ["2 Pedro", "2 Peter", null], ch: 3 },
      { osis: "1John",names: ["1 João", "1 John", null], ch: 5 },
      { osis: "2John",names: ["2 João", "2 John", null], ch: 1 },
      { osis: "3John",names: ["3 João", "3 John", null], ch: 1 },
      { osis: "Jude", names: ["Judas", "Jude", null], ch: 1 },
      { osis: "Rev",  names: ["Apocalipse", "Revelation", null], ch: 22 },
    ];

    const VERSION_LANG = {
      "almeida-livre": "pt",
      "kjv": "en",
      "web": "en",
      "asv": "en",
      "wlc": "he",
      "aleppo": "he",
    };
    function activeBibleSlug() {
      return state.bible.version; // almeida-livre | kjv | web | asv
    }
    function isHebrew() {
      return state.bible.hebrew;
    }
    function hebrewSlug() { return "wlc"; }
    function activeLang() {
      const slug = isHebrew() ? hebrewSlug() : activeBibleSlug();
      return VERSION_LANG[slug] || "pt";
    }

    let bibleCache = {};
    let bibleBooks = null; // lista de livros para o current version

    function populatesBookList() {
      const sel = $("bibleBook");
      sel.innerHTML = "";
      const he = isHebrew();
      BOOK_META.forEach((m, i) => {
        if (he && m.names[2] === null) return; // esconder NT no hebraico
        const opt = document.createElement("option");
        opt.value = m.osis;
        const label = he ? (m.names[2] || m.names[0]) + " — " + m.names[0] : m.names[0] + (m.names[2] ? " — "+m.names[2] : "");
        opt.textContent = label;
        sel.appendChild(opt);
      });
      sel.value = state.bible.book;
    }

    function populateChapterList(bookMeta) {
      const sel = $("bibleChapter");
      sel.innerHTML = "";
      for (let i = 1; i <= bookMeta.ch; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = "Cap. " + i;
        sel.appendChild(opt);
      }
      sel.value = state.bible.chapter;
    }

    async function loadBookJson(slug, osis) {
      const lang = VERSION_LANG[slug] || "pt";
      const key = slug + "/" + osis;
      if (bibleCache[key]) return bibleCache[key];
      const res = await fetch("data/biblia/" + lang + "/" + slug + "/books/" + osis + ".json");
      if (!res.ok) throw new Error("Livro não encontrado: " + osis);
      const data = await res.json();
      bibleCache[key] = data;
      return data;
    }

    function bibleSaveKey() {
      const slug = isHebrew() ? hebrewSlug() : activeBibleSlug();
      return slug + "|" + state.bible.book + "|" + state.bible.chapter;
    }
    function saveBibleRender(html) {
      state.bible.saved[bibleSaveKey()] = html;
      saveState();
    }

    function renderBibleChapter(bookData, chapterNum) {
      const content = $("bibleContent");
      const ch = bookData.chapters.find((c) => c.chapter === chapterNum);
      if (!ch) { content.innerHTML = "<p class='text-gray-400'>Capítulo não encontrado.</p>"; return; }

      const saved = state.bible.saved[bibleSaveKey()];
      if (saved) {
        if (isHebrew()) {
          content.className = "flex-1 overflow-auto p-6 bg-white text-gray-900 leading-relaxed hebrew-text";
        } else {
          content.className = "flex-1 overflow-auto p-6 bg-white text-gray-900 leading-relaxed";
        }
        content.innerHTML = saved;
        return;
      }

      if (isHebrew()) {
        content.className = "flex-1 overflow-auto p-6 bg-white text-gray-900 leading-relaxed hebrew-text";
        let html = '<div class="text-gray-500 text-base mb-4" dir="ltr">' + (bookData.englishName || "") + "</div>";
        ch.verses.forEach((v) => {
          html += '<p class="mb-2"><span class="text-gray-500 ml-1">' + v.number + '.</span> ' + v.text + "</p>";
        });
        content.innerHTML = html;
        saveBibleRender(html);
      } else {
        content.className = "flex-1 overflow-auto p-6 bg-white text-gray-900 leading-relaxed";
        let html = '<div class="text-lg font-semibold text-gray-700 mb-2">' +
          (bookData.englishName || "") + " " + chapterNum + "</div>";
        const paras = [];
        let cur = "";
        ch.verses.forEach((v) => {
          cur += '<span class="font-semibold text-gray-500">' + v.number + '.</span> ' + v.text + " ";
        });
        html += "<p> " + cur.trim() + "</p>";
        content.innerHTML = html;
        saveBibleRender(html);
      }
    }

    async function loadBible() {
      const slug = activeBibleSlug();
      const he = isHebrew();
      populatesBookList();

      const meta = BOOK_META.find((m) => m.osis === state.bible.book);
      if (!meta) { state.bible.book = "Gen"; return loadBible(); }

      populateChapterList(meta);

      try {
        const useSlug = he ? hebrewSlug() : slug;
        const data = await loadBookJson(useSlug, state.bible.book);
        renderBibleChapter(data, state.bible.chapter);
      } catch (e) {
        $("bibleContent").innerHTML = "<p class='text-red-500'>Erro ao carregar o texto. É necessário servir via HTTP (não abrir direto do arquivo). Detalhe: " + e.message + "</p>";
      }
    }

    $("bibleVersion").addEventListener("change", (e) => {
      state.bible.version = e.target.value;
      saveState();
      loadBible();
    });
    $("chkHebrew").addEventListener("change", (e) => {
      state.bible.hebrew = e.target.checked;
      // hebraico só tem AT
      const m = BOOK_META.find((m) => m.osis === state.bible.book);
      if (state.bible.hebrew && m && m.names[2] === null) {
        state.bible.book = "Gen";
        state.bible.chapter = 1;
      }
      saveState();
      loadBible();
    });
    $("bibleBook").addEventListener("change", (e) => {
      state.bible.book = e.target.value;
      state.bible.chapter = 1;
      saveState();
      loadBible();
    });
    $("bibleChapter").addEventListener("change", (e) => {
      state.bible.chapter = parseInt(e.target.value, 10);
      saveState();
      loadBible();
    });
    $("bibleFontRange").addEventListener("input", (e) => {
      const content = $("bibleContent");
      content.style.fontSize = e.target.value + "px";
    });
    $("bibleCopy").addEventListener("click", () => {
      const content = $("bibleContent");
      const text = content.innerText;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => alert("Copiado!")).catch(() => alert("Não foi possível copiar."));
      } else {
        alert("Navegador sem suporte a clipboard.");
      }
    });

    // Marcar realce/sublinhado no texto bíblico selecionado
    function wrapSelectionIn(tagName) {
      const content = $("bibleContent");
      if (!content) return;
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
        alert("Selecione primeiro um trecho do texto bíblico.");
        return;
      }
      const range = sel.getRangeAt(0);
      const container = range.commonAncestorContainer;
      if (!content.contains(container.nodeType === 3 ? container.parentNode : container)) {
        alert("Selecione o texto dentro da área da Bíblia.");
        return;
      }
      const el = document.createElement(tagName);
      try {
        range.surroundContents(el);
      } catch (e) {
        const frag = range.extractContents();
        el.appendChild(frag);
        range.insertNode(el);
      }
      sel.removeAllRanges();
      saveBibleRender(content.innerHTML);
    }
    $("bibleMark").addEventListener("click", () => wrapSelectionIn("mark"));
    $("bibleUnder").addEventListener("click", () => wrapSelectionIn("u"));
    $("bibleUnmark").addEventListener("click", () => {
      if (!confirm("Remover todos os realces e sublinhados desta página?")) return;
      delete state.bible.saved[bibleSaveKey()];
      saveState();
      loadBible();
    });

    /* =========================================================
       Redimensionar overlay
       ========================================================= */
    function onViewerResize() {
      const att = page().attachment;
      if (!att) return;
      if (att.type === "pdf" && currentPdfDoc) {
        drawPdfPage(currentPdfDoc, att.currentPdfPage || 1);
      } else if (att.type === "image") {
        if (mediaLayer.complete) {
          positionCanvas(mediaLayer.naturalWidth, mediaLayer.naturalHeight);
          if (page().drawing) {
            const img = new Image();
            img.onload = () => { ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height); ctx.drawImage(img, 0, 0, drawingCanvas.width, drawingCanvas.height); };
            img.src = page().drawing;
          }
        }
      }
    }
    window.addEventListener("resize", onViewerResize);
    viewer.addEventListener("resize", onViewerResize);

    function savePrefs() {
      page().fontSize = editor.style.fontSize;
    }
    if (page().fontSize) editor.style.fontSize = page().fontSize;

    /* =========================================================
       Bootstrap
       ========================================================= */
    loadState();
    // configurar controles da Bíblia com o estado carregado
    $("bibleVersion").value = state.bible.version;
    $("chkHebrew").checked = state.bible.hebrew;
    renderUI();
    applyLayout();
    applyTab();
  </script>
</body>
</html>
